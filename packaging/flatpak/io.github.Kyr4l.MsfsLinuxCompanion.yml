# Flatpak build of msfs-linux-companion: packaging/build-flatpak.sh builds it and writes dist/msfs-linux-companion-<version>-x86_64.flatpak.
app-id: io.github.Kyr4l.MsfsLinuxCompanion
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: msfs-linux-companion
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=all                 # joysticks (/dev/input/event*), the Winwing vibration (/dev/hidraw*), the GPU
  - --share=network              # SimConnect is a TCP socket on 127.0.0.1 (MSFS under Proton listens on a random loopback port)
  # the same settings and logs as the AppImage (the launcher points XDG_CONFIG_HOME / XDG_STATE_HOME there)
  - --filesystem=xdg-config/msfs-linux-companion:create
  - --filesystem=~/.local/state/msfs-linux-companion:create
  # the sim's packages, read only (tooltips, checklists: automatic catalogs and guides); other library folders: flatpak override --filesystem=PATH:ro
  - --filesystem=~/.local/share/Steam:ro
  - --filesystem=~/.steam:ro
  - --filesystem=~/.var/app/com.valvesoftware.Steam:ro
  - --filesystem=/mnt:ro
  - --filesystem=/media:ro
  - --filesystem=/run/media:ro
modules:
  - name: glfw
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DGLFW_BUILD_EXAMPLES=OFF
      - -DGLFW_BUILD_TESTS=OFF
      - -DGLFW_BUILD_DOCS=OFF
      - -DGLFW_BUILD_WAYLAND=ON
      - -DGLFW_BUILD_X11=ON
    sources:
      - type: archive
        url: https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.zip
        sha256: b5ec004b2712fd08e8861dc271428f048775200a2df719ccf575143ba749a3e9
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig

  - name: msfs-linux-companion
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCOMPANION_BUILD_TESTS=OFF
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - build
          - build-appimage
          - build-flatpak
          - .flatpak-builder
          - dist
          - local
          - _cpr
      - type: file
        path: msfs-linux-companion.sh
    post-install:
      # the program behind a launcher that keeps the settings in ~/.config/msfs-linux-companion; it finds its data at ../share from /app/libexec
      - install -Dm755 /app/bin/msfs-linux-companion /app/libexec/msfs-linux-companion
      - install -Dm755 msfs-linux-companion.sh /app/bin/msfs-linux-companion
      - mv /app/share/applications/msfs-linux-companion.desktop /app/share/applications/io.github.Kyr4l.MsfsLinuxCompanion.desktop
      - sed -i 's/^Icon=.*/Icon=io.github.Kyr4l.MsfsLinuxCompanion/' /app/share/applications/io.github.Kyr4l.MsfsLinuxCompanion.desktop
      - for f in /app/share/icons/hicolor/*/apps/msfs-linux-companion.*; do mv "$f" "${f%/*}/io.github.Kyr4l.MsfsLinuxCompanion.${f##*.}"; done
