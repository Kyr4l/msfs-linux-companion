name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config python3 \
            libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      # Ubuntu 24.04 ships GLFW 3.3; the program needs 3.4 (runtime Wayland / X11 selection).
      - name: Build GLFW 3.4
        run: |
          git clone --depth 1 --branch 3.4 https://github.com/glfw/glfw.git "$RUNNER_TEMP/glfw"
          cmake -S "$RUNNER_TEMP/glfw" -B "$RUNNER_TEMP/glfw/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF
          cmake --build "$RUNNER_TEMP/glfw/build"
          sudo cmake --install "$RUNNER_TEMP/glfw/build"
          sudo ldconfig

      - name: Configure and build
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Guides and catalogs
        run: python3 -I tools/validate_guides.py

      - name: Tests
        run: ctest --test-dir build --output-on-failure
